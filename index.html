        <h1>The Way</h1>
        <p>The Way is a free, open-source pixel art RPG that plays in the browser. You follow Jesus through
        the Gospels, not as a spectator, but as someone who was there. Every encounter is a choice: listen,
        serve, pray, or pass by. The game never forces a choice, and it remembers the ones you make.</p>
        <p>Season 1, "The Son of Man", has five acts: Galilee, the Mountain, Jerusalem, the Passion and the
        Resurrection. Each major story opens a Scroll Room with its Old Testament roots and a Hebrew or Greek
        word study.</p>
        <p>The game needs JavaScript to run. The source code is on
        <a style="color: #e8c070;" href="https://github.com/VadneyK/the-way">GitHub</a> under the MIT license.
        Made by <a style="color: #e8c070;" href="https://vadneyk.github.io/portfolio/">Kentaro Vadney</a>.</p>
      </main>
    </noscript>
