name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The page must pass the search and AI-answer checks before it is published.
      - name: Check the built page
        run: |
          mkdir -p /tmp/site && cp -r dist /tmp/site/the-way
          python3 -m http.server 8765 -d /tmp/site >/dev/null 2>&1 &
          sleep 1
          python3 scripts/check_seo.py http://127.0.0.1:8765/the-way/ --site-base http://127.0.0.1:8765/the-way/ --live-base https://vadneyk.github.io/the-way/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
